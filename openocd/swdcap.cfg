# swdcap target support for stock OpenOCD.
#
# Select the adapter and the SWD transport first, then source this file and run "init":
#
#   source [find interface/cmsis-dap.cfg]
#   transport select swd
#   adapter speed 1000
#   source openocd/swdcap.cfg
#   init
#   swdcap_probe
#
# The gateway is a designer-AP, not a MEM-AP: "mdw" and "dap info" do not apply. Everything goes
# through "dap apreg" on the four AP registers. Register map: docs/regmap.md.

set SWDCAP_DPIDR  0x0ba11aab
set SWDCAP_AP_IDR 0x74726976
set SWDCAP_MAGIC  0x43445753

swd newdap swdcap cpu -expected-id $SWDCAP_DPIDR
dap create swdcap.dap -chain-position swdcap.cpu

# AP register offsets
set SWDCAP_AP_REG_IDR      0x00
set SWDCAP_AP_REG_DMI_ADDR 0x04
set SWDCAP_AP_REG_DMI_DATA 0x08

# Read one DMI word. "dap apreg" performs the posted-read handshake, so this returns the value
# at $addr. An address that is not implemented raises a Tcl error (the DP sets STICKYERR, which
# OpenOCD clears).
proc swdcap_rd {addr} {
	global SWDCAP_AP_REG_DMI_ADDR SWDCAP_AP_REG_DMI_DATA
	swdcap.dap apreg 0 $SWDCAP_AP_REG_DMI_ADDR $addr
	return [swdcap.dap apreg 0 $SWDCAP_AP_REG_DMI_DATA]
}

# Write one DMI word. The read of DMI_ADDR afterwards waits for the write to complete, so that
# an error is reported by this call and not by the next one.
proc swdcap_wr {addr value} {
	global SWDCAP_AP_REG_DMI_ADDR SWDCAP_AP_REG_DMI_DATA
	swdcap.dap apreg 0 $SWDCAP_AP_REG_DMI_ADDR $addr
	swdcap.dap apreg 0 $SWDCAP_AP_REG_DMI_DATA $value
	swdcap.dap apreg 0 $SWDCAP_AP_REG_DMI_ADDR
	return
}

# Number of bits DMI_ADDR stores. Addresses at or above 2^width alias; do not use them.
proc swdcap_addr_width {} {
	global SWDCAP_AP_REG_DMI_ADDR
	swdcap.dap apreg 0 $SWDCAP_AP_REG_DMI_ADDR 0xffffffff
	set v [swdcap.dap apreg 0 $SWDCAP_AP_REG_DMI_ADDR]
	set width 0
	while {$v != 0} { incr width; set v [expr {$v >> 1}] }
	return $width
}

# Identify the target and print what was generated into it. Raises an error if it is not swdcap.
proc swdcap_probe {} {
	global SWDCAP_AP_IDR SWDCAP_MAGIC SWDCAP_AP_REG_IDR
	set idr [swdcap.dap apreg 0 $SWDCAP_AP_REG_IDR]
	if {$idr != $SWDCAP_AP_IDR} {
		error [format "AP_IDR mismatch: got 0x%08x, expected 0x%08x" $idr $SWDCAP_AP_IDR]
	}
	set magic [swdcap_rd 0x0100]
	if {$magic != $SWDCAP_MAGIC} {
		error [format "MAGIC mismatch: got 0x%08x, expected 0x%08x (gateway found, but not swdcap)" $magic $SWDCAP_MAGIC]
	}
	set version  [swdcap_rd 0x0101]
	set features [swdcap_rd 0x0102]
	set clk      [swdcap_rd 0x0103]
	set eio      [swdcap_rd 0x0104]
	set names {}
	foreach {bit name} {0 EIO 1 ELA 2 UART 3 BUS_WB 4 BUS_AXI 5 DM} {
		if {($features >> $bit) & 1} { lappend names $name }
	}
	if {[llength $names] == 0} { set names none }
	echo [format "AP_IDR       0x%08x" $idr]
	echo [format "MAGIC        0x%08x" $magic]
	echo [format "VERSION      %d.%d.%d" [expr {$version >> 16}] [expr {($version >> 8) & 0xff}] [expr {$version & 0xff}]]
	echo [format "FEATURES     0x%08x (%s)" $features [join $names " "]]
	echo [format "DEBUG_CLK_HZ %d%s" $clk [expr {$clk == 0 ? " (unknown)" : ""}]]
	echo [format "EIO_WIDTH    %d out, %d in" [expr {($eio >> 8) & 0xff}] [expr {$eio & 0xff}]]
	echo [format "DMI_ADDR     %d bits" [swdcap_addr_width]]
	return
}
